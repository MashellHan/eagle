name: Check
on:
  push:
    branches: [main, feature/eagle-machines-herdr]
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The npm workspace install covers apps/web, packages/contracts and
      # packages/agent; the root test suite also packs and installs the Agent.
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Native integration packs/builds the actual Agent and exercises launchd/WS.
      - run: npm ci
      # The retained native-to-Bot recovery gate owns its separate daemon install.
      - run: npm ci --prefix apps/bots
      - run: npm run test:native-integration
      # The SPM/Swift Testing/coverage gates remain separate and required.
      - run: scripts/swift-gate.sh build --package-path apps/macos
      - run: cd apps/macos && swift format lint --strict --recursive Sources Scripts Tests
      - run: apps/macos/Scripts/coverage.sh
