name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The npm workspace install covers apps/web, packages/contracts and
      # packages/agent; the root test suite also packs and installs the Agent.
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The macOS client is a standalone SPM package with no npm dependency.
      - run: swift build --package-path apps/macos
      - run: swift run --package-path apps/macos EagleChecks
