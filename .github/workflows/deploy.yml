name: Deploy
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not configured for this repository"
            exit 0
          fi
          npm run deploy
      - name: Verify the deployed revision
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          expected="${{ github.event.workflow_run.head_sha }}"
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS https://eagle-ingest.hexly.ai/api/live | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).revision))')"
            echo "live revision: $live"
            [ "$live" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error title=Revision mismatch::live revision did not reach $expected"
          exit 1
